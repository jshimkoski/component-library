name: Publish to npm

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org/'
      
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Generate changelog
        run: |
          # Try to get the latest tag; fall back to initial commit if none
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Create changelog header
          echo "## Changelog for $(date +'%Y-%m-%d')" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          # Define commit range
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi

          # Gather categorized commits
          FEATURE_COMMITS=$(git log $RANGE --pretty=format:"- %s" | grep -E "^feat(\(.+\))?:")
          FIX_COMMITS=$(git log $RANGE --pretty=format:"- %s" | grep -E "^fix(\(.+\))?:")
          BREAKING_COMMITS=$(git log $RANGE --pretty=format:"- %s" | grep "BREAKING CHANGE:")

          # Write features
          echo "### Features" >> CHANGELOG.md
          if [ -n "$FEATURE_COMMITS" ]; then
            echo "$FEATURE_COMMITS" >> CHANGELOG.md
          else
            echo "No new features" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md

          # Write fixes
          echo "### Fixes" >> CHANGELOG.md
          if [ -n "$FIX_COMMITS" ]; then
            echo "$FIX_COMMITS" >> CHANGELOG.md
          else
            echo "No fixes" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md

          # Write breaking changes
          echo "### Breaking Changes" >> CHANGELOG.md
          if [ -n "$BREAKING_COMMITS" ]; then
            echo "$BREAKING_COMMITS" >> CHANGELOG.md
          else
            echo "No breaking changes" >> CHANGELOG.md
          fi

          # Preview changelog for debugging
          echo "Generated CHANGELOG:"
          cat CHANGELOG.md


      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip ci]" || echo "No changes to commit"
          git push

      - name: Determine version bump from commit
        id: bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE:"* ]]; then
            echo "major" > .bump
          elif [[ "$COMMIT_MSG" == feat:* ]]; then
            echo "minor" > .bump
          elif [[ "$COMMIT_MSG" == fix:* ]]; then
            echo "patch" > .bump
          else
            echo "patch" > .bump
          fi

      - name: Bump version
        id: version
        run: |
          BUMP_TYPE=$(cat .bump)
          BRANCH=${GITHUB_REF##*/}
          # Ensure version includes -beta for develop
          if [[ "$BRANCH" == "develop" ]]; then
            NEW_VERSION=$(npm version "pre$BUMP_TYPE" --preid=beta -m "release: %s [skip ci]")
          else
            NEW_VERSION=$(npm version "$BUMP_TYPE" -m "release: %s [skip ci]")
          fi
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          git push --follow-tags

      - name: Publish to npm
        run: |
          BRANCH=${GITHUB_REF##*/}
          if [[ "$BRANCH" == "develop" ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
